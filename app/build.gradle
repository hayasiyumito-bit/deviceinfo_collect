plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 上报服务端配置：从 local.properties(已 gitignore)或环境变量读取，绝不写入受版本控制的源码。
// 与 YumyHook 管理器共用同一服务端；采集 App 上报时标记 source=collect_app 以便服务端区分。
def reportProps = new Properties()
def reportPropsFile = rootProject.file("local.properties")
if (reportPropsFile.exists()) { reportPropsFile.withInputStream { reportProps.load(it) } }
def reportBaseUrl = reportProps.getProperty("report.baseUrl", System.getenv("REPORT_BASE_URL") ?: "")
def reportApiKey = reportProps.getProperty("report.apiKey", System.getenv("REPORT_API_KEY") ?: "")

android {
    namespace 'com.android.device'
    compileSdk 34

    defaultConfig {
        applicationId 'com.android.device'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"

        buildConfigField "String", "PROVENANCE_FINGERPRINT", "\"YDC-7F3A9C2E-202607\""
        buildConfigField "String", "PROVENANCE_PROJECT_ID", "\"device-collection\""
        buildConfigField "String", "PROVENANCE_OWNER", "\"Yumito\""
        buildConfigField "String", "REPORT_BASE_URL", "\"${reportBaseUrl}\""
        buildConfigField "String", "REPORT_API_KEY", "\"${reportApiKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            zipAlignEnabled true
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            versionNameSuffix '-dev'
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    // 原生风控库（libdevice.so）已迁入 :collections，随其 AAR 传递进来，
    // :app 不再本地编译 CMake。
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'
    implementation project(':collections')
}

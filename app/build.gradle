plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.device'
    compileSdk 34

    defaultConfig {
        applicationId 'com.android.device'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "3.0"

        buildConfigField "String", "PROVENANCE_FINGERPRINT", "\"YDC-7F3A9C2E-202607\""
        buildConfigField "String", "PROVENANCE_PROJECT_ID", "\"device-collection\""
        buildConfigField "String", "PROVENANCE_OWNER", "\"Yumito\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            zipAlignEnabled true
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            versionNameSuffix '-dev'
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'
    implementation project(':collections')
}

plugins {
    id 'com.android.library'
}

android {
    namespace 'com.android.device'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    buildTypes {

        debug {
            zipAlignEnabled true
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
            versionNameSuffix '-dev'
            debuggable true
        }

        release {
            zipAlignEnabled true
            // 库不自混淆：由 :app 的 R8 对整个程序统一混淆，避免库先改名导致
            // app 引用 HackChecker/DeviceSnapshot/Cmd 等类时 R8「Missing class」及运行期 NoClassDefFound。
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false

            /**aar重命名*/
            android.libraryVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "libapp_info.aar"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig false
    }


}

dependencies {
    //implementation 'androidx.core:core:1.9.0'
    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    //implementation("com.android.installreferrer:installreferrer:2.2")
    api 'io.github.maven-rep:json:1.0.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // 用于交叉核对 GMS Fused 定位路径（Google Maps 等真机 App 走这条，而非 AOSP LocationManager）
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}